name: Review source snapshot
on:
  pull_request:
    paths:
      - .github/workflows/review-source-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/review-lifecycle-root-causes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output="${RUNNER_TEMP}/mapagent-source.zip" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: mapagent-review-source
          path: ${{ runner.temp }}/mapagent-source.zip
          if-no-files-found: error
          retention-days: 1
